<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="German International School Washington D.C.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1320"/>
      <stop offset="0.55" stop-color="#16203a"/>
      <stop offset="1" stop-color="#1f2d4d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffce00"/>
      <stop offset="1" stop-color="#ffd84d"/>
    </linearGradient>
    <style>
      .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: 0.5px; }
      .sub  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 4px; }
      .tag  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- German flag accent bar -->
  <g>
    <rect x="0" y="0" width="14" height="360" fill="#000000"/>
    <rect x="14" y="0" width="14" height="360" fill="#dd0000"/>
    <rect x="28" y="0" width="14" height="360" fill="#ffce00"/>
  </g>

  <!-- Monogram badge -->
  <g transform="translate(120,80)">
    <rect x="0" y="0" width="200" height="200" rx="24" fill="#0b0f1a" stroke="#2b3a5e" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="20" rx="10" fill="#000000"/>
    <rect x="0" y="16" width="200" height="14" fill="#dd0000"/>
    <rect x="0" y="30" width="200" height="14" fill="#ffce00"/>
    <text x="100" y="140" text-anchor="middle" class="name" font-size="92" fill="#ffffff">GISW</text>
    <text x="100" y="176" text-anchor="middle" class="sub" font-size="14" fill="#9fb0d0">EST. 1961</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(370,0)">
    <text x="0" y="140" class="name" font-size="54" fill="#ffffff">German International School</text>
    <text x="0" y="202" class="name" font-size="54" fill="url(#gold)">Washington&#160;D.C.</text>
    <text x="2" y="248" class="sub" font-size="20" fill="#ffd84d">INDEPENDENT &#183; BILINGUAL &#183; WELTOFFEN</text>
    <text x="2" y="284" class="tag" font-size="20" fill="#aebbd6">PreK&#8211;12 &#183; Potomac, Maryland &#183; Est. 1961</text>
  </g>
</svg>
