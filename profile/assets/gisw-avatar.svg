<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GISW — German International School Washington D.C.">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.78">
      <stop offset="0" stop-color="#2d3a86"/>
      <stop offset="0.6" stop-color="#273171"/>
      <stop offset="1" stop-color="#1b2354"/>
    </radialGradient>
    <style>
      .mono { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; }
      .lab  { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Circle-safe: content kept within the central safe area -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Brand-red accent arc across the top of the safe circle -->
  <path d="M 92 158 A 188 188 0 0 1 420 158" fill="none" stroke="#e8112d" stroke-width="14" stroke-linecap="round"/>

  <!-- Monogram -->
  <text x="256" y="296" text-anchor="middle" class="mono" font-size="156" fill="#ffffff">GISW</text>

  <!-- Wordmark -->
  <text x="256" y="352" text-anchor="middle" class="lab" font-size="25" fill="#ffffff">WASHINGTON D.C.</text>

  <!-- Motto -->
  <text x="256" y="406" text-anchor="middle" class="lab" font-size="15" fill="#c9d0ef">INDEPENDENT &#183; BILINGUAL &#183; WELTOFFEN</text>
</svg>
